name: ResultGen end-to-end example

on:
  push:
    branches:
      - prototype/result-gen-source-transformer
  pull_request:

jobs:
  result-gen-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Transform, compile, and run the example
        run: ./gradlew :result-gen-example:runExample
